name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install make
        # procps: `make test` uses pgrep to find a running simulator
        run: apt-get update && apt-get install -y make procps

      - name: Generate developer key
        run: |
          openssl genrsa -out /tmp/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/developer_key.pem -out /tmp/developer_key.der -nocrypt

      - name: Skip devices the image does not know yet
        env:
          HOME: /root
        run: .github/scripts/prune-unknown-devices.sh

      - name: Build gimporter (default device)
        run: |
          make build SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der

      - name: Run unit tests
        env:
          # The image keeps the simulator's device and font files in
          # /root/.Garmin; GitHub sets HOME to /github/home in containers.
          HOME: /root
        run: |
          export DISPLAY=:1
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          /connectiq/bin/simulator > /dev/null 2>&1 &
          sleep 5
          # One device per kind of special case:
          #   oregon7xx    API 2.2: no Communications.transmit, no Storage
          #   approachs62  built without the content API ((:nocontent))
          #   d2charlie    API 3.0: no fitTextToArea, gimporter wraps itself
          #   instinct2    subscreen
          #   fenix6       API 3.4, the long-standing reference
          #   fenix847mm   current AMOLED watch, API 6
          #   edge1050     rectangular Edge
          for device in oregon7xx approachs62 d2charlie instinct2 fenix6 fenix847mm edge1050; do
            echo "::group::unit tests on $device"
            make test DEVICE=$device SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der
            echo "::endgroup::"
          done

      - name: Build the store packages (all devices)
        # One compiler run per variant builds every device of the manifest,
        # exactly what is uploaded to the Connect IQ store.
        run: |
          make package SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der

      - name: Upload the store packages
        uses: actions/upload-artifact@v4
        with:
          name: gimporter-packages
          path: bin/*.iq
          retention-days: 7
