name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install make
        # procps: `make test` uses pgrep to find a running simulator
        run: apt-get update && apt-get install -y make procps

      - name: Generate developer key
        run: |
          openssl genrsa -out /tmp/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/developer_key.pem -out /tmp/developer_key.der -nocrypt

      - name: Build gimporter (default device)
        run: |
          make build SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der

      - name: Run unit tests
        env:
          # The image keeps the simulator's device and font files in
          # /root/.Garmin; GitHub sets HOME to /github/home in containers.
          HOME: /root
        run: |
          export DISPLAY=:1
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          /connectiq/bin/simulator > /dev/null 2>&1 &
          sleep 5
          make test DEVICE=fenix6 SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der

      - name: Build for all devices
        run: |
          make -j"$(nproc)" buildall SDK_HOME=/connectiq PRIVATE_KEY=/tmp/developer_key.der

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gimporter-builds
          path: bin/*.prg
          retention-days: 7
